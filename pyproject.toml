[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machscope"
version = "0.3.0"
description = "A small macOS process flight recorder for learning systems concepts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil==7.2.2"]

[project.scripts]
machscope = "machscope:main"

[tool.setuptools]
py-modules = [
    "machscope",
    "observe",
    "storage",
    "recording",
    "analysis",
    "event_tracker",
    "benchmark",
    "native",
    "demo",
]
